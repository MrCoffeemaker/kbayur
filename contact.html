<body>
  <main class="page-shell contact-page editorial-page">
    <div class="editorial-topline contact-topline">
      <a href="index.html" class="editorial-back"><svg class="back-arrow" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg><span>BACK TO HOME</span></a>

    <header class="profile-hero">
      <p class="editorial-kicker">GET IN TOUCH</p>
      <h1>Let's talk.</h1>
      <p class="bio">Have a project, an idea, or just want to say hello? Drop me a message.</p>
    </header>
    <div id="form-container">
      <form id="contact-form" action="https://formspree.io/f/mvgqkzle" method="POST" novalidate>
        <label for="name">01 / YOUR NAME</label>
        <input type="text" name="name" id="name" autocomplete="name" placeholder="Your name" required />
        <label for="email">02 / EMAIL ADDRESS</label>
        <input type="email" name="email" id="email" autocomplete="email" placeholder="you@example.com" required />
        <label for="message">03 / YOUR MESSAGE</label>
        <textarea name="message" id="message" rows="3" placeholder="Tell me what's on your mind..." required></textarea>
        <button type="submit" class="link-button"><span>Send message</span><span class="send-arrow" aria-hidden="true">→</span></button>
      </form>
    </div>
    <div id="thank-you" role="status" aria-live="polite">
      <h2>Thank you!</h2>
      <p>Your message has been sent successfully.</p>
      <a href="index.html" class="editorial-back">← BACK TO HOME</a>
    </div>
