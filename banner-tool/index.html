<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b12"><title>KAAN / Particle Architecture</title><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:#090b12;color:#f7f7fb}*{box-sizing:border-box}body{margin:0;padding:clamp(20px,5vw,64px)}main{max-width:1220px;margin:auto}header{display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap;margin-bottom:30px}h1{font-size:clamp(26px,4vw,44px);font-weight:600;letter-spacing:-.055em;margin:0}h1 span{color:#9f7aea}small,.meta{color:#858899;font-size:12px}.frame{background:#090b12;border:1px solid #292b39;border-radius:5px;overflow:hidden}svg{display:block;width:100%;height:auto;aspect-ratio:4/1}.meta{display:flex;justify-content:space-between;margin:12px 0 32px;font-family:monospace}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px;margin-bottom:28px}label{display:flex;justify-content:space-between;font-size:12px;color:#a7a9b8;margin-bottom:9px}input{width:100%;accent-color:#9f7aea;margin-top:9px}.actions{display:flex;gap:10px;flex-wrap:wrap}button{border:1px solid #343749;border-radius:5px;background:#171a25;color:#f7f7fb;padding:12px 22px;cursor:pointer;font-weight:600}button:hover{border-color:#9f7aea}button.primary{background:#f7f7fb;color:#090b12;border-color:#f7f7fb}footer{margin-top:42px;color:#858899;font-size:12px}@media(max-width:700px){.controls{gap:12px}.actions button{flex:1}body{padding:20px}}@media(max-width:460px){.controls{grid-template-columns:1fr}}
</style></head><body><main><header><h1>KAAN<span> / </span>Particle Architecture</h1><small>ONE VISUAL LANGUAGE. INFINITE COMPOSITIONS.</small></header>
<div class="frame"><svg id="art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" role="img" aria-label="Procedural depth layered particle architecture"></svg></div>
<div class="meta"><span>1584 × 396 · FULL BLEED</span><span id="seed"></span></div>
<section class="controls"><div><label for="density">Density <span id="dv">60%</span></label><input id="density" type="range" min="10" max="100" value="60"></div><div><label for="depth">Depth <span id="zv">70%</span></label><input id="depth" type="range" min="10" max="100" value="70"></div><div><label for="variation">Variation <span id="vv">65%</span></label><input id="variation" type="range" min="10" max="100" value="65"></div></section>
<div class="actions"><button id="gen" class="primary">↻ Generate</button><button id="png">↓ PNG</button><button id="svg">↓ SVG</button></div><footer>Procedural point sculptures · No templates · No external assets</footer></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),svg=$('art'),NS='http://www.w3.org/2000/svg';let seed=0,count=0,animation=null;const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
function random(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function el(tag,attrs={},parent=svg){let e=document.createElementNS(NS,tag);for(let k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e}
function draw(animate=false){if(animation){animation.cancel();animation=null}const previous=animate?Array.from(svg.querySelectorAll('g[fill] circle')).map(e=>({x:+e.getAttribute('cx'),y:+e.getAttribute('cy'),r:+e.getAttribute('r'),opacity:+e.getAttribute('opacity')||.5})):[];count++;let bytes=new Uint32Array(1);if(crypto?.getRandomValues)crypto.getRandomValues(bytes);else bytes[0]=Math.floor(Math.random()*4294967295);seed=(bytes[0]^Math.imul(count,2654435761))>>>0;
const r=random(seed),R=(a,b)=>a+(b-a)*r(),pick=a=>a[Math.floor(r()*a.length)],den=+$('density').value/100,dep=+$('depth').value/100,v=+$('variation').value/100;
svg.replaceChildren();const defs=el('defs');let grad=el('radialGradient',{id:'halo',cx:'50%',cy:'50%',r:'50%'},defs);el('stop',{offset:'0%','stop-color':'#6b8cff','stop-opacity':'.11'},grad);el('stop',{offset:'100%','stop-color':'#6b8cff','stop-opacity':'0'},grad);el('rect',{width:1584,height:396,fill:'#090b12'});const cx=R(360,1250),cy=R(80,320);el('ellipse',{cx,cy,rx:R(280,780),ry:R(100,340),fill:'url(#halo)'});
const layer=el('g');let particles=[];const form=pick(['ribbon','fold','vortex','dune','twist']),bands=Math.floor(R(2,5)),phase=R(-6,6),freq=R(.004,.014),tilt=R(-.35,.35)*v,spread=R(40,140),twist=R(.5,2.5),rows=Math.floor(18+den*40),cols=Math.floor(115+den*155);
for(let band=0;band<bands;band++){let bandPhase=phase+band*R(.35,1.15),offset=(band-(bands-1)/2)*spread;for(let j=0;j<rows;j++){let q=j/(rows-1),depth=q*2-1;for(let i=0;i<cols;i++){if(r()<.08+v*.07)continue;let u=i/(cols-1),x=u*1740-80;let envelope=Math.pow(Math.sin(Math.PI*u),R(.15,.7));let wave=Math.sin(x*freq+bandPhase+q*twist),wave2=Math.cos(x*freq*.53+phase*1.3+q*5);let y;
if(form==='ribbon')y=190+offset+wave*65+depth*(36+dep*95)+wave2*30;
else if(form==='fold')y=190+offset+wave*105*envelope+Math.sin(q*7+u*8)*depth*70;
else if(form==='vortex')y=190+offset+Math.sin(u*11+bandPhase+q*3)*95*envelope+depth*55;
else if(form==='dune')y=240+offset+wave*80+depth*(20+dep*130)*envelope;
else y=195+offset+Math.sin(u*12+q*5+bandPhase)*80+depth*70*Math.cos(u*5+phase);
y+=(x-792)*tilt*.25;let z=Math.sin(u*8+q*4+bandPhase)*.5+depth*.5;let perspective=1+z*dep*.55;let px=792+(x-792)*perspective,py=198+(y-198)*perspective;px+=R(-1,1)*v*1.6;py+=R(-1,1)*v*1.6;if(px<0||px>1584||py<0||py>396)continue;let light=Math.max(0,Math.sin(u*9+bandPhase+q*1.7))*.45+.35;let opacity=Math.min(.9,Math.max(.08,(.24+z*.3+light*.3)*(1-Math.abs(depth)*.15)));let radius=Math.max(.35,(.65+dep*1.6*(z+1)/2)*R(.65,1.25));particles.push({x:px,y:py,z,radius,opacity,accent:r()<.012+v*.018})}}}
particles.sort((a,b)=>a.z-b.z);const chunks=[el('g',{'fill':'#6d7294'} ,layer),el('g',{'fill':'#f7f7fb'},layer),el('g',{'fill':'#9f7aea'},layer)];for(let p of particles){let group=p.accent?chunks[2]:p.z<-.15?chunks[0]:chunks[1];el('circle',{cx:p.x.toFixed(2),cy:p.y.toFixed(2),r:p.radius.toFixed(2),opacity:p.opacity.toFixed(2)},group)}
for(let k=0;k<Math.floor(25+den*65);k++){let x=R(0,1584),y=R(0,396);el('circle',{cx:x,cy:y,r:R(.25,1.25),fill:k%11===0?'#9f7aea':'#a7a9b8',opacity:R(.08,.35)},layer)}
if(animate&&!reducedMotion.matches&&previous.length){const nodes=Array.from(svg.querySelectorAll('g[fill] circle')),duration=1550,start=performance.now();const targets=nodes.map((e,i)=>({e,x:+e.getAttribute('cx'),y:+e.getAttribute('cy'),r:+e.getAttribute('r'),o:+e.getAttribute('opacity')||.5,old:previous[Math.min(previous.length-1,Math.floor(i*previous.length/Math.max(1,nodes.length)))]}));for(const t of targets){t.e.setAttribute('cx',t.old.x);t.e.setAttribute('cy',t.old.y);t.e.setAttribute('r',t.old.r);t.e.setAttribute('opacity',t.old.opacity)}let frame=0;const controller={cancel(){cancelAnimationFrame(frame);for(const t of targets){t.e.setAttribute('cx',t.x);t.e.setAttribute('cy',t.y);t.e.setAttribute('r',t.r);t.e.setAttribute('opacity',t.o)}}};animation=controller;const tick=now=>{if(animation!==controller)return;let t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,4),arc=Math.sin(Math.PI*t)*(18+v*45);for(let i=0;i<targets.length;i++){const p=targets[i],o=p.old,offset=Math.sin(i*.19+seed*.00001)*arc;p.e.setAttribute('cx',(o.x+(p.x-o.x)*ease).toFixed(2));p.e.setAttribute('cy',(o.y+(p.y-o.y)*ease+offset).toFixed(2));p.e.setAttribute('r',(o.r+(p.r-o.r)*ease).toFixed(2));p.e.setAttribute('opacity',(o.opacity+(p.o-o.opacity)*ease).toFixed(2))}if(t<1)frame=requestAnimationFrame(tick);else animation=null};frame=requestAnimationFrame(tick)}$('seed').textContent='SEED '+seed.toString(16).toUpperCase().padStart(8,'0')}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000)}
function xml(){if(animation){animation.cancel();animation=null}let c=svg.cloneNode(true);c.setAttribute('width','1584');c.setAttribute('height','396');return new XMLSerializer().serializeToString(c)}
$('gen').onclick=()=>draw(true);for(let [a,b] of [['density','dv'],['depth','zv'],['variation','vv']])$(a).oninput=()=>$(b).textContent=$(a).value+'%';
$('svg').onclick=()=>download(new Blob([xml()],{type:'image/svg+xml;charset=utf-8'}),'kaan-particle-'+seed+'.svg');
$('png').onclick=()=>{let u=URL.createObjectURL(new Blob([xml()],{type:'image/svg+xml;charset=utf-8'})),img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=1584;c.height=396;c.getContext('2d').drawImage(img,0,0);c.toBlob(b=>{if(b)download(b,'kaan-particle-'+seed+'.png');else alert('PNG export failed')},'image/png');URL.revokeObjectURL(u)};img.onerror=()=>{URL.revokeObjectURL(u);alert('PNG export failed')};img.src=u};draw()})();
</script></body></html>
