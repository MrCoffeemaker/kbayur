<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b12"><title>KAAN / Particle Architecture</title><style>

</style></head><body><main><header><h1>KAAN<span> / </span>Particle Architecture</h1><small>ONE VISUAL LANGUAGE. INFINITE COMPOSITIONS.</small></header>
<div class="frame"><svg id="art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" role="img" aria-label="Procedural depth layered particle architecture"></svg></div>
<div class="meta"><span>1584 × 396 · VECTOR MASTER · PNG UP TO 6336 × 1584</span><span id="seed"></span></div>
<div class="palette-control"><label for="palette">Colour palette</label><select id="palette"><option value="original">Original · Midnight / Violet</option><option value="space">Space Grey · Graphite / Silver</option></select></div><section class="controls"><div><label for="density">Density <span id="dv">60%</span></label><input id="density" type="range" min="10" max="100" value="60"></div><div><label for="depth">Depth <span id="zv">70%</span></label><input id="depth" type="range" min="10" max="100" value="70"></div><div><label for="variation">Variation <span id="vv">65%</span></label><input id="variation" type="range" min="10" max="100" value="65"></div></section>
<div class="actions"><button id="gen" class="primary">↻ Generate</button><button id="png">↓ PNG 4×</button><button id="png2">↓ PNG 2×</button><button id="svg">↓ SVG</button></div><footer>Procedural point sculptures · No templates · No external assets</footer></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),svg=$('art'),NS='http://www.w3.org/2000/svg';let seed=0,count=0,animation=null;const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');const palettes={original:{bg:'#090b12',glow:'#6b8cff',back:'#6d7294',front:'#f7f7fb',accent:'#9f7aea',dust:'#a7a9b8'},space:{bg:'#17191d',glow:'#8b929d',back:'#646b75',front:'#e5e8ec',accent:'#aab1bb',dust:'#8b929d'}};let currentPalette='original';
function random(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function el(tag,attrs={},parent=svg){let e=document.createElementNS(NS,tag);for(let k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e}
function draw(animate=false){if(animation){animation.cancel();animation=null}const previous=animate?Array.from(svg.querySelectorAll('g[fill] circle')).map(e=>({x:+e.getAttribute('cx'),y:+e.getAttribute('cy'),r:+e.getAttribute('r'),opacity:+e.getAttribute('opacity')||.5})):[];count++;let bytes=new Uint32Array(1);if(crypto?.getRandomValues)crypto.getRandomValues(bytes);else bytes[0]=Math.floor(Math.random()*4294967295);seed=(bytes[0]^Math.imul(count,2654435761))>>>0;
const palette=palettes[currentPalette],r=random(seed),R=(a,b)=>a+(b-a)*r(),pick=a=>a[Math.floor(r()*a.length)],den=+$('density').value/100,dep=+$('depth').value/100,v=+$('variation').value/100;
svg.replaceChildren();const defs=el('defs');let grad=el('radialGradient',{id:'halo',cx:'50%',cy:'50%',r:'50%'},defs);el('stop',{offset:'0%','stop-color':palette.glow,'stop-opacity':'.11'},grad);el('stop',{offset:'100%','stop-color':'#6b8cff','stop-opacity':'0'},grad);el('rect',{width:1584,height:396,fill:palette.bg});const cx=R(360,1250),cy=R(80,320);el('ellipse',{cx,cy,rx:R(280,780),ry:R(100,340),fill:'url(#halo)'});
const layer=el('g');let particles=[];const form=pick(['sphere','torus','spiral','cloud','columns','fracture','tunnel','ribbon']),phase=R(-6,6),total=Math.floor(1800+den*10500),centers=Array.from({length:Math.floor(R(1,4))},()=>({x:R(220,1400),y:R(65,330),size:R(90,300)})),focus=pick(centers);
const push=(x,y,z,light=1)=>{let scale=1+z*dep*.35,px=792+(x-792)*scale,py=198+(y-198)*scale;if(px<0||px>1584||py<0||py>396)return;let radius=Math.max(.65,R(.65,1.35)*(1.05+dep*(z+1)*.7)),opacity=Math.min(.94,Math.max(.08,(.32+z*.25+light*.3)*R(.7,1.1)));particles.push({x:px,y:py,z,radius,opacity,accent:r()<.01+v*.012})};
for(let i=0;i<total;i++){let u=r(),w=r(),angle=u*Math.PI*2,angle2=w*Math.PI*2,x=0,y=0,z=0,light=1,c=pick(centers),radius=c.size;
if(form==='sphere'){let latitude=Math.acos(2*w-1),rr=radius*(.8+.2*Math.sin(angle*3+phase)*v);x=c.x+rr*Math.sin(latitude)*Math.cos(angle);y=c.y+rr*.58*Math.sin(latitude)*Math.sin(angle);z=Math.cos(latitude)*.7+Math.cos(angle)*.3;light=.5+.5*Math.sin(latitude)}
else if(form==='torus'){let major=radius*.68,minor=radius*.32*(.6+v*.7);x=c.x+(major+minor*Math.cos(angle2))*Math.cos(angle);y=c.y+(major+minor*Math.cos(angle2))*Math.sin(angle)*.65;z=Math.sin(angle2)*.7+Math.sin(angle)*.3;light=.4+.5*Math.cos(angle2)}
else if(form==='spiral'){let t=u*Math.PI*R(5,10),rr=20+u*radius; x=c.x+Math.cos(t+phase)*rr;y=c.y+Math.sin(t+phase)*rr*.55+(w-.5)*65;z=(w-.5)*1.7;light=u}
else if(form==='cloud'){let gaussian=()=>r()+r()+r()+r()-2;x=c.x+gaussian()*radius*.6;y=c.y+gaussian()*radius*.35;z=gaussian()*.4;light=.3+Math.max(0,z)}
else if(form==='columns'){let col=Math.floor(u*R(6,18)),count=12,step=radius*2/count;x=c.x+(col-count/2)*step+(r()-.5)*step*.4;y=c.y+(w-.5)*radius*1.6;z=Math.sin(col*.8+phase)*.65+(r()-.5)*.3;light=.35+Math.abs(Math.sin(col*.7))}
else if(form==='fracture'){let k=Math.floor(u*R(3,9)),theta=k*2.399+phase,dist=35+k*radius*.2;x=c.x+Math.cos(theta)*dist+(r()+r()-1)*radius*.45;y=c.y+Math.sin(theta)*dist*.65+(w+r()-1)*radius*.3;z=Math.sin(theta)*.7+(r()-.5)*.3;light=.45+u*.5}
else if(form==='tunnel'){let t=angle,rad=radius*(.2+.8*w);x=792+(u-.5)*1600;y=198+Math.sin(t+phase)*rad*.7;z=Math.cos(t)*.9;light=.5+.5*Math.cos(t)}
else{let t=u*1700-50,depth=w*2-1;x=t;y=198+Math.sin(t*.009+phase+depth*2)*radius*.42+depth*radius*.4;z=depth;light=.4+.5*Math.sin(t*.008)}
push(x,y,z,light)}
particles.sort((a,b)=>a.z-b.z);const chunks=[el('g',{'fill':palette.back} ,layer),el('g',{'fill':palette.front},layer),el('g',{'fill':palette.accent},layer)];for(let p of particles){let group=p.accent?chunks[2]:p.z<-.15?chunks[0]:chunks[1];el('circle',{cx:p.x.toFixed(2),cy:p.y.toFixed(2),r:p.radius.toFixed(2),opacity:p.opacity.toFixed(2)},group)}
for(let k=0;k<Math.floor(25+den*65);k++){let x=R(0,1584),y=R(0,396);el('circle',{cx:x,cy:y,r:R(.25,1.25),fill:k%11===0?palette.accent:palette.dust,opacity:R(.08,.35)},layer)}
if(animate&&!reducedMotion.matches&&previous.length){const nodes=Array.from(svg.querySelectorAll('g[fill] circle')),duration=1550,start=performance.now();const targets=nodes.map((e,i)=>({e,x:+e.getAttribute('cx'),y:+e.getAttribute('cy'),r:+e.getAttribute('r'),o:+e.getAttribute('opacity')||.5,old:previous[Math.min(previous.length-1,Math.floor(i*previous.length/Math.max(1,nodes.length)))]}));for(const t of targets){t.e.setAttribute('cx',t.old.x);t.e.setAttribute('cy',t.old.y);t.e.setAttribute('r',t.old.r);t.e.setAttribute('opacity',t.old.opacity)}let frame=0;const controller={cancel(){cancelAnimationFrame(frame);for(const t of targets){t.e.setAttribute('cx',t.x);t.e.setAttribute('cy',t.y);t.e.setAttribute('r',t.r);t.e.setAttribute('opacity',t.o)}}};animation=controller;const tick=now=>{if(animation!==controller)return;let t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,4),arc=Math.sin(Math.PI*t)*(18+v*45);for(let i=0;i<targets.length;i++){const p=targets[i],o=p.old,offset=Math.sin(i*.19+seed*.00001)*arc;p.e.setAttribute('cx',(o.x+(p.x-o.x)*ease).toFixed(2));p.e.setAttribute('cy',(o.y+(p.y-o.y)*ease+offset).toFixed(2));p.e.setAttribute('r',(o.r+(p.r-o.r)*ease).toFixed(2));p.e.setAttribute('opacity',(o.opacity+(p.o-o.opacity)*ease).toFixed(2))}if(t<1)frame=requestAnimationFrame(tick);else animation=null};frame=requestAnimationFrame(tick)}$('seed').textContent='SEED '+seed.toString(16).toUpperCase().padStart(8,'0')}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000)}
function xml(){if(animation){animation.cancel();animation=null}let c=svg.cloneNode(true);c.setAttribute('width','1584');c.setAttribute('height','396');return new XMLSerializer().serializeToString(c)}
$('gen').onclick=()=>draw(true);$('palette').onchange=()=>{currentPalette=$('palette').value;draw(false)};for(let [a,b] of [['density','dv'],['depth','zv'],['variation','vv']])$(a).oninput=()=>$(b).textContent=$(a).value+'%';
$('svg').onclick=()=>download(new Blob([xml()],{type:'image/svg+xml;charset=utf-8'}),'kaan-particle-'+seed+'.svg');
function exportPNG(scale){const source=xml(),blob=new Blob([source],{type:'image/svg+xml;charset=utf-8'}),u=URL.createObjectURL(blob),img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=1584*scale;c.height=396*scale;const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{if(b)download(b,'kaan-particle-'+seed+'-'+scale+'x.png');else alert('PNG export failed')},'image/png');URL.revokeObjectURL(u)};img.onerror=()=>{URL.revokeObjectURL(u);alert('PNG export failed')};img.src=u}$('png').onclick=()=>exportPNG(4);$('png2').onclick=()=>exportPNG(2);draw()})();
</script></body></html>
