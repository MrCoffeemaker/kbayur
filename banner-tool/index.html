<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101112"><title>Generative Banner Lab</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,sans-serif;background:#101112;color:#f3f3ee}*{box-sizing:border-box}body{margin:0;padding:clamp(20px,5vw,64px)}main{max-width:1200px;margin:auto}header{display:flex;justify-content:space-between;align-items:baseline;gap:15px;flex-wrap:wrap;margin-bottom:30px}h1{font-size:clamp(24px,4vw,42px);font-weight:600;letter-spacing:-.055em;margin:0}small,.meta{color:#a2a5a2;font-size:12px}.frame{border:1px solid #414442;border-radius:6px;overflow:hidden;background:#171817}svg{display:block;width:100%;height:auto;aspect-ratio:4/1}.meta{display:flex;justify-content:space-between;margin:12px 0 28px;font-family:monospace}.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:24px}label{display:flex;justify-content:space-between;font-size:12px;color:#bcbfba;margin-bottom:9px}select,input{width:100%;accent-color:#c8e76c}select{background:#202221;color:#f5f5f0;border:1px solid #424540;border-radius:5px;padding:11px}input{margin-top:11px}.actions{display:flex;gap:10px;flex-wrap:wrap}button{border:1px solid #474a46;border-radius:5px;background:#232523;color:#f2f3ef;padding:12px 22px;cursor:pointer;font-weight:600}button:hover{border-color:#b9d76b}button.primary{background:#c8e76c;color:#151713;border-color:#c8e76c}footer{margin-top:42px;font-size:12px;color:#878b86}@media(max-width:720px){.controls{grid-template-columns:repeat(2,minmax(0,1fr))}.actions button{flex:1}body{padding:20px}}</style></head>
<body><main><header><h1>Generative Banner Lab<span style="color:#c8e76c">.</span></h1><small>AN EXPERIMENT IN CONTROLLED CHAOS</small></header>
<div class="frame"><svg id="art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" role="img" aria-label="Generated full-width banner artwork"></svg></div>
<div class="meta"><span>1584 × 396 / FULL BLEED</span><span id="seed"></span></div>
<section class="controls"><div><label for="style">Graphic style</label><select id="style"><option value="random">Surprise me</option><option value="orbit">Orbital geometry</option><option value="flow">Flow fields</option><option value="grid">Broken grid</option><option value="particles">Particles</option><option value="topo">Topographic</option></select></div><div><label for="palette">Colour palette</label><select id="palette"><option value="random">Surprise me</option><option value="ink">Ink & lime</option><option value="paper">Paper & black</option><option value="blue">Midnight blue</option><option value="warm">Warm neutral</option></select></div><div><label for="complex">Complexity <span id="cv">55%</span></label><input id="complex" type="range" min="10" max="100" value="55"></div><div><label for="chaos">Chaos <span id="hv">40%</span></label><input id="chaos" type="range" min="0" max="100" value="40"></div></section>
<div class="actions"><button class="primary" id="gen">↻ Generate</button><button id="png">↓ Export PNG</button><button id="svg">↓ Export SVG</button></div>
<footer>Generative artwork. No templates, no external assets, no tracking.</footer></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),svg=$('art'),NS='http://www.w3.org/2000/svg';let seed=0,serial=0,last='';
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function el(tag,attrs={},parent=svg){let e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));parent.appendChild(e);return e}
function draw(){serial++;let bytes=new Uint32Array(1);if(window.crypto?.getRandomValues)crypto.getRandomValues(bytes);else bytes[0]=Math.floor(Math.random()*4294967295);seed=(bytes[0]^Math.imul(serial,2654435761))>>>0;
const r=rng(seed),R=(a,b)=>a+(b-a)*r(),pick=a=>a[Math.floor(r()*a.length)];
const palettes={ink:['#0b0d0d','#d4f05a','#68776e'],paper:['#efeee8','#171917','#a3aaa2'],blue:['#0b1626','#92b6db','#506e91'],warm:['#282521','#e0ae81','#867b6e']};
let pal=$('palette').value,style=$('style').value;if(pal==='random')pal=pick(Object.keys(palettes));let styles=['orbit','flow','grid','particles','topo'];if(style==='random'){style=pick(styles.filter(s=>s!==last));last=style}
let [bg,fg,muted]=palettes[pal],c=+$('complex').value/100,h=+$('chaos').value/100;svg.replaceChildren();el('rect',{width:1584,height:396,fill:bg});const g=el('g',{fill:'none','stroke-linecap':'round'});
const line=(x1,y1,x2,y2,color=fg,w=1,op=1,parent=g)=>el('line',{x1,y1,x2,y2,stroke:color,'stroke-width':w,opacity:op},parent);
const circ=(x,y,rad,color=fg,w=1,fill='none',op=1)=>el('circle',{cx:x,cy:y,r:Math.max(.2,rad),stroke:color,'stroke-width':w,fill,opacity:op},g);
const path=(d,color=fg,w=1,op=1)=>el('path',{d,stroke:color,'stroke-width':w,opacity:op},g);
let n=Math.floor(35+c*140),direction=pick([-1,1]),shift=R(-250,250),scale=R(.55,1.7);
if(style==='orbit'){let centers=Array.from({length:Math.floor(R(2,7))},()=>[R(-150,1734),R(-200,600)]);centers.forEach(([x,y])=>{let count=Math.floor(R(5,22)*(.5+c)),step=R(7,34)*scale;for(let i=0;i<count;i++){let rad=(i+1)*step;circ(x,y,rad,i%5===0?fg:muted,i%7===0?2.3:.7,'none',R(.2,.8));if(r()>.55){let a=R(0,6.28);circ(x+Math.cos(a)*rad,y+Math.sin(a)*rad,R(2,8),fg,0,fg)}}})}
else if(style==='flow'){let freq=R(.002,.014),amp=R(20,180)*scale,spacing=R(2,16);for(let i=0;i<n;i++){let d='',base=shift+(i-n/2)*spacing+198,phase=R(-2,2),wave=R(.1,1.5);for(let x=-50;x<=1640;x+=10){let y=base+Math.sin(x*freq+phase+i*.06)*amp*wave+Math.sin(x*freq*2.7+i*.13)*amp*h*.5;d+=(x===-50?'M':'L')+x+' '+y+' '}path(d,i%11===0?fg:muted,i%13===0?2:.8,R(.2,.8))}}
else if(style==='grid'){let cell=R(20,65)*scale,angle=R(-.25,.25),gg=el('g',{transform:`rotate(${angle*180/Math.PI} 792 198)`},g);for(let x=-200;x<1800;x+=cell)line(x,-200,x,600,muted,.6,.23,gg);for(let y=-200;y<600;y+=cell)line(-200,y,1800,y,muted,.6,.23,gg);for(let i=0;i<n*2;i++){let x=Math.floor(R(-100,1700)/cell)*cell,y=Math.floor(R(-100,500)/cell)*cell,s=cell*R(.3,4);if(r()>.45)el('rect',{x,y,width:s,height:cell*R(.2,2),fill:r()>.7?fg:muted,opacity:R(.15,.8)},gg);else line(x,y,x+s,y+R(-s,s),fg,R(1,4),.8,gg)}}
else if(style==='particles'){let centers=Array.from({length:Math.floor(R(2,6))},()=>[R(0,1584),R(0,396)]),pts=[];for(let i=0;i<n*3;i++){let center=pick(centers),x=center[0]+(r()+r()+r()-1.5)*R(180,900)*scale,y=center[1]+(r()+r()+r()-1.5)*R(100,430)*scale;pts.push([x,y]);circ(x,y,R(.5,5),r()>.7?fg:muted,0,r()>.7?fg:muted,R(.2,.9))}for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){let d=Math.hypot(pts[i][0]-pts[j][0],pts[i][1]-pts[j][1]);if(d<55+h*90&&r()>.65)line(...pts[i],...pts[j],muted,.6,(1-d/160)*.4)}}
else{let freq=R(.002,.015),base=R(-100,400),gap=R(2,13)*direction;for(let i=0;i<n;i++){let d='';let a=R(20,65)*scale;for(let x=-30;x<=1620;x+=12){let y=base+i*gap+Math.sin(x*freq+i*.035)*a+Math.cos(x*freq*2+i*.12)*h*85;d+=(x===-30?'M':'L')+x+' '+y+' '}path(d,i%12===0?fg:muted,.8,R(.15,.7))}}
for(let i=0;i<8;i++){let x=R(0,1584),y=R(0,396),s=R(3,15);line(x-s,y,x+s,y,fg,1,.5);line(x,y-s,x,y+s,fg,1,.5)}$('seed').textContent='SEED '+seed.toString(16).toUpperCase().padStart(8,'0')}
function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function xml(){let c=svg.cloneNode(true);c.setAttribute('width','1584');c.setAttribute('height','396');return new XMLSerializer().serializeToString(c)}
$('gen').addEventListener('click',draw);$('complex').oninput=()=>$('cv').textContent=$('complex').value+'%';$('chaos').oninput=()=>$('hv').textContent=$('chaos').value+'%';
$('svg').onclick=()=>download(new Blob([xml()],{type:'image/svg+xml;charset=utf-8'}),'kaan-banner-'+seed+'.svg');
$('png').onclick=()=>{let u=URL.createObjectURL(new Blob([xml()],{type:'image/svg+xml;charset=utf-8'})),img=new Image();img.onload=()=>{let canvas=document.createElement('canvas');canvas.width=1584;canvas.height=396;canvas.getContext('2d').drawImage(img,0,0);canvas.toBlob(b=>{if(b)download(b,'kaan-banner-'+seed+'.png');else alert('PNG export failed')},'image/png');URL.revokeObjectURL(u)};img.onerror=()=>{URL.revokeObjectURL(u);alert('PNG export failed')};img.src=u};draw();
})();
</script></body></html>
